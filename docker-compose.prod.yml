services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kamancha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamancha_prod_secret}
      POSTGRES_DB: kamancha
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kamancha']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-kamancha_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-kamancha_redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:4050:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://kamancha:${POSTGRES_PASSWORD:-kamancha_prod_secret}@postgres:5432/kamancha
      MONGODB_URI: mongodb://mongo:27017/kamancha
      REDIS_URL: redis://:${REDIS_PASSWORD:-kamancha_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@kamancha.am}
      SMTP_PASS: ${SMTP_PASS:-placeholder}
      EMAIL_FROM: "Kamancha Restaurant <${SMTP_USER:-noreply@kamancha.am}>"
      FRONTEND_URL: https://khamancha.duckdns.org
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://khamancha.duckdns.org
        NEXT_PUBLIC_SITE_URL: https://khamancha.duckdns.org
    ports:
      - '127.0.0.1:3050:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  redis_data:
