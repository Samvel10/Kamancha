services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kamancha
      POSTGRES_PASSWORD: kamancha
      POSTGRES_DB: kamancha
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kamancha']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://kamancha:kamancha@postgres:5432/kamancha
      MONGODB_URI: mongodb://mongo:27017/kamancha
      REDIS_URL: redis://redis:6379
      JWT_SECRET: kamancha_jwt_secret_super_long_key_32chars_minimum
      JWT_REFRESH_SECRET: kamancha_refresh_secret_super_long_key_minimum
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: noreply@kamancha.am
      SMTP_PASS: placeholder
      EMAIL_FROM: "Kamancha Restaurant <noreply@kamancha.am>"
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  redis_data:
